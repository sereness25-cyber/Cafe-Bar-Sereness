<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | Café & Bar Sereness</title>
    <meta name="description" content="秋田市のエンタメバー Sereness（セレネス）のイベントスケジュールと詳細。">
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <style>
        :root { --primary-bg:#FAFAFA; --text-main:#333; --accent-color:#A68B5B; --section-bg:#F5F5F0; }
        * { box-sizing: border-box; }
        body { margin:0; font-family:"Noto Serif JP","Hiragino Mincho ProN",serif; color:var(--text-main); background:var(--primary-bg); line-height:1.8; letter-spacing:.05em; }
        .elegant-font { font-family:'Playfair Display',serif; }
        header { background:var(--text-main); color:#fff; padding:20px; display:flex; justify-content:space-between; align-items:center; letter-spacing:.1em; }
        header a { color:var(--accent-color); text-decoration:none; font-size:.9em; width:60px; text-align:right; }
        .container { max-width:800px; margin:0 auto; padding:40px 20px; }
        .page-title { text-align:center; margin-bottom:30px; }
        .page-title h2 { color:var(--accent-color); font-size:24px; font-weight:normal; margin:0 0 5px; }
        .page-title p { color:#666; font-size:.9em; margin:0; }

        .tabs { display:flex; justify-content:center; gap:10px; margin-bottom:30px; }
        .tab { background:none; border:1px solid var(--accent-color); color:var(--accent-color); padding:8px 22px; border-radius:30px; font:inherit; font-size:.9em; cursor:pointer; letter-spacing:.08em; }
        .tab[aria-selected="true"] { background:var(--accent-color); color:#fff; }
        .tab:focus-visible, .ev-row:focus-visible, .btn:focus-visible, .modal-close:focus-visible { outline:3px solid #333; outline-offset:2px; }

        .month-head { font-family:'Playfair Display',serif; color:var(--accent-color); font-size:1.15em; border-bottom:1px solid var(--accent-color); padding-bottom:6px; margin:36px 0 0; }
        .month-head:first-child { margin-top:0; }
        .ev-row { display:grid; grid-template-columns:72px 1fr auto; gap:18px; align-items:start; background:#fff; border:1px solid #EAEAEA; border-top:none; padding:20px 18px; cursor:pointer; transition:background .2s; }
        .ev-row:hover { background:#fcfaf6; }
        .ev-day { text-align:center; line-height:1.1; }
        .ev-day b { display:block; font-family:'Playfair Display',serif; font-size:2em; font-weight:500; color:var(--text-main); }
        .ev-day span { font-size:.8em; color:#888; }
        .ev-day .sun { color:#d9534f; } .ev-day .sat { color:#5b7da6; }
        .ev-meta { font-size:.8em; color:#777; margin-bottom:2px; }
        .ev-cat { display:inline-block; background:var(--accent-color); color:#fff; font-size:.7em; padding:1px 8px; border-radius:3px; margin-right:8px; letter-spacing:.05em; }
        .ev-title { font-size:1.1em; margin:2px 0 4px; font-weight:bold; }
        .ev-desc { font-size:.88em; color:#555; margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .ev-thumb { width:120px; height:90px; object-fit:cover; border-radius:4px; background:var(--section-bg); }
        .empty { text-align:center; color:#777; padding:50px 10px; background:#fff; border:1px solid #EAEAEA; }

        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:100; align-items:center; justify-content:center; padding:15px; }
        .modal-content { background:#fff; width:100%; max-width:560px; max-height:90vh; overflow-y:auto; border-radius:8px; position:relative; }
        .modal-close { position:absolute; top:10px; right:10px; width:36px; height:36px; border:none; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; font-size:20px; line-height:1; cursor:pointer; }
        .modal-img { display:block; width:100%; max-height:340px; object-fit:cover; border-radius:8px 8px 0 0; }
        .modal-body { padding:25px 25px 30px; }
        .modal-body h3 { text-align:left; font-size:1.3em; margin:6px 0 14px; font-weight:bold; }
        .modal-desc { font-size:.95em; word-break:break-word; }
        .modal-desc a { color:var(--accent-color); text-decoration:underline; word-break:break-all; }
        .btn { display:block; text-align:center; background:var(--accent-color); color:#fff; padding:12px; border-radius:4px; text-decoration:none; font-weight:bold; letter-spacing:.1em; margin-top:24px; }
        .ev-price { margin:0 0 4px; font-size:.9em; font-weight:bold; color:var(--text-main); }
        .ev-price::before { content:"参加費"; display:inline-block; margin-right:8px; padding:0 7px; border:1px solid var(--accent-color); border-radius:3px; color:var(--accent-color); font-size:.8em; font-weight:normal; }
        .modal-price { font-size:1.05em; font-weight:bold; margin:0 0 16px; padding:10px 14px; background:var(--section-bg); border-left:4px solid var(--accent-color); }
        .res-note { margin:24px 0 0; padding:12px 14px; background:var(--section-bg); border-left:4px solid var(--accent-color); font-size:.9em; }
        .btn-back { display:block; width:80%; max-width:300px; margin:40px auto 20px; padding:15px; text-align:center; background:var(--text-main); color:#fff; text-decoration:none; border-radius:4px; font-weight:bold; letter-spacing:.1em; }
        footer { text-align:center; padding:20px; font-size:13px; background:#222; color:#888; }

        @media (max-width:767px) {
            .container { padding:30px 15px; }
            .ev-row { grid-template-columns:56px 1fr; gap:12px; padding:16px 12px; }
            .ev-thumb { grid-column:1 / -1; width:100%; height:170px; }
            .btn-back { width:100%; }
        }
        @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
    </style>
</head>
<body>
    <header>
        <div style="width:60px;"></div>
        <div class="elegant-font">Café &amp; Bar Sereness</div>
        <a href="index.html">Topへ</a>
    </header>

    <main class="container">
        <div class="page-title">
            <h2 class="elegant-font">Events</h2>
            <p>イベントのスケジュールと詳細</p>
        </div>

        <div class="tabs" role="tablist">
            <button class="tab" role="tab" id="tab-upcoming" aria-selected="true" onclick="setTab('upcoming')">開催予定</button>
            <button class="tab" role="tab" id="tab-past" aria-selected="false" onclick="setTab('past')">過去のイベント</button>
        </div>

        <div id="eventList"><div class="empty">読み込み中...</div></div>

        <a href="index.html" class="btn-back">← トップページに戻る</a>
    </main>

    <footer>© 2026 Cafe &amp; Bar Sereness. All rights reserved.</footer>

    <div id="evModal" class="modal-overlay" onclick="closeModal()" role="dialog" aria-modal="true" aria-label="イベント詳細">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()" aria-label="閉じる">×</button>
            <div id="modalInner"></div>
        </div>
    </div>

    <script src="events-common.js"></script>
    <script>
        let events = [];
        let tab = "upcoming";
        let lastFocus = null;

        function byDateTime(a, b) { return (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")); }

        function dayClass(w) { return w === "日" ? "sun" : (w === "土" ? "sat" : ""); }

        function render() {
            const today = todayStr();
            const upcoming = events.filter(function (e) { return e.date >= today; }).sort(byDateTime);
            const past = events.filter(function (e) { return e.date < today; }).sort(function (a, b) { return byDateTime(b, a); });
            const list = tab === "upcoming" ? upcoming : past;
            const box = document.getElementById("eventList");

            if (!list.length) {
                box.innerHTML = '<div class="empty">' + (tab === "upcoming" ? "現在、開催予定のイベントはありません。<br>決まり次第こちらでお知らせします。" : "過去のイベントはありません。") + "</div>";
                return;
            }
            let html = "", month = "";
            list.forEach(function (ev) {
                const p = parseDate(ev.date);
                const ym = p.y + "." + pad2(p.m);
                if (ym !== month) { month = ym; html += '<h3 class="month-head">' + ym + "</h3>"; }
                html += '<article class="ev-row" tabindex="0" role="button" data-id="' + esc(ev.id) + '">' +
                    '<div class="ev-day"><b>' + p.d + '</b><span class="' + dayClass(p.w) + '">' + p.w + "</span></div>" +
                    "<div>" +
                    '<div class="ev-meta">' + (ev.category ? '<span class="ev-cat">' + esc(ev.category) + "</span>" : "") + esc(ev.time || "") + "</div>" +
                    '<div class="ev-title">' + esc(ev.title) + "</div>" +
                    (ev.price ? '<div class="ev-price">' + esc(ev.price) + "</div>" : "") +
                    (ev.description ? '<p class="ev-desc">' + esc(ev.description) + "</p>" : "") +
                    "</div>" +
                    (ev.image ? '<img class="ev-thumb" src="' + esc(thumbUrl(ev.image, 480)) + '" alt="" loading="lazy" decoding="async">' : "") +
                    "</article>";
            });
            box.innerHTML = html;
        }

        function setTab(t) {
            tab = t;
            document.getElementById("tab-upcoming").setAttribute("aria-selected", t === "upcoming");
            document.getElementById("tab-past").setAttribute("aria-selected", t === "past");
            render();
        }

        function openModal(id) {
            const ev = events.find(function (e) { return e.id === id; });
            if (!ev) return;
            const p = parseDate(ev.date);
            const isUpcoming = ev.date >= todayStr();
            document.getElementById("modalInner").innerHTML =
                (ev.image ? '<img class="modal-img" src="' + esc(ev.image) + '" alt="">' : "") +
                '<div class="modal-body">' +
                '<div class="ev-meta">' + (ev.category ? '<span class="ev-cat">' + esc(ev.category) + "</span>" : "") +
                p.y + "." + pad2(p.m) + "." + pad2(p.d) + "（" + p.w + "）" + (ev.time ? " " + esc(ev.time) : "") + "</div>" +
                "<h3>" + esc(ev.title) + "</h3>" +
                (ev.price ? '<div class="modal-price">参加費　' + esc(ev.price) + "</div>" : "") +
                '<div class="modal-desc">' + (ev.description ? autoLink(ev.description) : "詳細はありません") + "</div>" +
                (isUpcoming && ev.reservable !== false ? '<p class="res-note">予約はお電話・LINE・InstagramのDMで承っております。</p>' : "") +
                "</div>";
            lastFocus = document.activeElement;
            document.getElementById("evModal").style.display = "flex";
            document.querySelector(".modal-close").focus();
            history.replaceState(null, "", "?id=" + encodeURIComponent(id));
        }

        function closeModal() {
            document.getElementById("evModal").style.display = "none";
            history.replaceState(null, "", location.pathname);
            if (lastFocus) lastFocus.focus();
        }

        document.getElementById("eventList").addEventListener("click", function (e) {
            const row = e.target.closest(".ev-row");
            if (row) openModal(row.dataset.id);
        });
        document.getElementById("eventList").addEventListener("keydown", function (e) {
            if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("ev-row")) {
                e.preventDefault();
                openModal(e.target.dataset.id);
            }
        });
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

        function apply(list, openFromUrl) {
            events = list;
            const id = new URLSearchParams(location.search).get("id");
            const target = id && events.find(function (e) { return e.id === id; });
            // URLで直接開かれた過去イベントは「過去」タブを表示
            if (openFromUrl && target && target.date < todayStr()) tab = "past";
            setTab(tab);
            if (openFromUrl && target) openModal(id);
        }

        // キャッシュがあれば即表示 → 裏で最新を取得
        let hadCache = false;
        if (!EV_IS_LOCAL) {
            try {
                const c = JSON.parse(localStorage.getItem(EV_CACHE_KEY) || "null");
                if (c) { apply(c, true); hadCache = true; }
            } catch (e) {}
        }
        EventAPI.listPublic().then(function (list) {
            if (!EV_IS_LOCAL) localStorage.setItem(EV_CACHE_KEY, JSON.stringify(list));
            apply(list, !hadCache);
        }).catch(function () {
            if (!hadCache) document.getElementById("eventList").innerHTML = '<div class="empty">イベント情報を取得できませんでした。<br>時間をおいて再度お試しください。</div>';
        });
    </script>
</body>
</html>
