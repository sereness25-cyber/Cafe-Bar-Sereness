<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記事一覧 | Sereness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <style>
        :root { --primary-bg: #FAFAFA; --text-main: #333333; --accent-color: #A68B5B; }
        body { margin: 0; padding: 0; font-family: "Noto Serif JP", "Hiragino Mincho ProN", serif; color: var(--text-main); background-color: var(--primary-bg); line-height: 1.8; letter-spacing: 0.05em; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        header { background-color: var(--text-main); padding: 20px; text-align: center; }
        .header-title { color: #fff; font-size: 1.4em; letter-spacing: 0.1em; font-family: 'Playfair Display', serif; font-weight: 500; }
        .elegant-font { font-family: 'Playfair Display', serif; }
        .normal-amp { font-family: "Noto Serif JP", serif; }
        .section-wrapper { background-color: white; padding: 40px 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #EAEAEA; text-align: left; }
        h2 { color: var(--accent-color); border-bottom: 1px solid var(--accent-color); padding-bottom: 15px; margin-top: 0; margin-bottom: 30px; font-size: 1.3em; display: inline-block; font-weight: normal;}
        
        .news-list { list-style: none; padding: 0; margin: 0; }
        .news-item { border-bottom: 1px dashed #DDD; padding: 15px 0; display: flex; align-items: center; gap: 15px; }
        .news-item:last-child { border-bottom: none; }
        .news-date { color: var(--accent-color); font-size: 0.85em; display: block; margin-bottom: 3px; }
        .news-title { color: var(--text-main); text-decoration: none; font-size: 0.95em; transition: color 0.3s; display: block; font-weight: bold; }
        .news-title:hover { color: var(--accent-color); }
        .blog-thumb { width: 70px; height: 70px; object-fit: cover; border-radius: 2px; background-color: #eee; flex-shrink: 0; }
        
        .btn-back { display: block; width: 100%; max-width: 300px; margin: 40px auto 0; padding: 15px; background: transparent; border: 1px solid var(--accent-color); color: var(--accent-color); text-align: center; border-radius: 4px; font-size: 0.95em; cursor: pointer; transition: 0.3s; text-decoration: none; box-sizing: border-box; font-weight: bold; }
        .btn-back:hover { background: var(--accent-color); color: white; }

        @media (max-width: 767px) {
            .container { padding: 30px 15px; }
            .section-wrapper { padding: 30px 15px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">Café <span class="normal-amp">&</span> Bar Sereness</div>
    </header>
    <div class="container">
        <div class="section-wrapper">
            <div style="text-align: center;">
                <h2 class="elegant-font" id="page-title">読み込み中...</h2>
            </div>
            <ul class="news-list" id="article-list">
                <li style="text-align: center; color: #666;">記事データを読み込んでいます...</li>
            </ul>
            <a href="index.html" class="btn-back">← トップページへ戻る</a>
        </div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type') || 'news';
        
        document.getElementById('page-title').innerText = type === 'news' ? 'News' : 'ブログ';
        
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzQRAhDa8-BhxaB6IqsQ-hTmkAYLlu_x-5VK44U20hibIarUrgLSGz7wmZDgPgFsQKD6g/exec";
        
        fetch(GAS_URL).then(res => res.json()).then(data => {
            let items = [];
            if(type === 'news' && data.news) items = data.news.sort((a, b) => (b.date > a.date) ? 1 : -1);
            if(type === 'blog' && data.blog) items = data.blog.sort((a, b) => (b.date > a.date) ? 1 : -1);
            
            const list = document.getElementById('article-list');
            list.innerHTML = '';
            
            if(items.length === 0) {
                list.innerHTML = '<li style="text-align: center; color: #666;">現在公開されている記事はありません。</li>';
                return;
            }
            
            items.forEach(article => {
                const thumbHtml = (type === 'blog' && article.image) ? `<img src="${article.image}" class="blog-thumb">` : '';
                list.innerHTML += `
                    <li class="news-item">
                        ${thumbHtml}
                        <div>
                            <span class="news-date">${article.date}</span>
                            <a href="news.html?id=${article.id}" class="news-title">${article.title}</a>
                        </div>
                    </li>
                `;
            });
        }).catch(err => {
            document.getElementById('article-list').innerHTML = '<li style="text-align: center; color: red;">読み込みに失敗しました。</li>';
        });
    </script>
</body>
</html>
